app = "kicktipp-agent"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  MCP_PATH = "/mcp"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm. Auto-stop with min=0 caused Fly's proxy to fail
  # routing ("could not find a good candidate") for requests that arrived
  # while the machine was waking up, which the upstream platform interpreted
  # as connection errors.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 5
    hard_limit = 10

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# Playwright + Chromium needs real memory. 1GB is the practical minimum.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
